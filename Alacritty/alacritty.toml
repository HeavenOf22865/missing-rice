[window]
padding = { x = 12, y = 12 }
dynamic_title = true
decorations = "full"
dimensions = { columns = 120, lines = 35 }

[font]
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono", style = "Regular" }
size = 12.0

[colors.primary]
background = "#1e1e1e"
foreground = "#c0c0c0"

[colors.cursor]
text = "#1e1e1e"
cursor = "#c0c0c0"

[colors.selection]
background = "#5c354f"
text = "#c0c0c0"

[colors.normal]
black = "#1b1c1e"
red = "#e05f65"      
green = "#78a97b"    
yellow = "#dfb56c"   
blue = "#688fbf"     
magenta = "#b18bb3"  
cyan = "#5ca7a8"     
white = "#c0c0c0"

[colors.bright]
black = "#505050"    
red = "#e05f65"      
green = "#78a97b"    
yellow = "#dfb56c"   
blue = "#688fbf"     
magenta = "#b18bb3"  
cyan = "#69c5c7"     
white = "#c0c0c0"

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true